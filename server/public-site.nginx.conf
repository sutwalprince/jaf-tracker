# Publishes the JAF Tracker website at your domain (enable-public-site.sh fills it in from ~/jaf-sync/site.json). web.py requires the password for everything.
limit_req_zone $jaf_login_key zone=jaflogin:1m rate=5r/m;

map $request_method $jaf_login_key {
    POST $binary_remote_addr;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name jaf.example.com;

    client_max_body_size 1m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The extension sends your portal login over Tailscale only, so this never faces the internet.
    location = /api/session {
        return 404;
    }

    location = /login {
        limit_req zone=jaflogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/jaf-proxy.conf;
    }

    # The live update stream stays open for up to 30 minutes.
    location = /api/events {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/jaf-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/jaf-proxy.conf;
    }
}
